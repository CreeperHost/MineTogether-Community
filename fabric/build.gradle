plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    runs {
        clientLogin {
            client()
            ideConfigGenerated true
            mainClass.set 'net.covers1624.devlogin.DevLogin'

            programArgs '--launch_target', 'net.fabricmc.loader.impl.launch.knot.KnotClient'
        }
    }
}

configurations {
    common
    shadowLib
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    shadowCommon.extendsFrom shadowLib
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    implementation.extendsFrom shadowLib
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    if (rootProject.file(".polylib-repo").exists()) {
        // Sideloaded polylib (settings.gradle includeBuild's .polylib-repo and
        // substitutes net.creeperhost:polylib-fabric with its :fabric project).
        //
        // Compile against the local source via that substitution, but RUN against
        // polylib's *production* jar. The production jar (a) has Architectury's
        // @ExpectPlatform transform applied, so platform stubs are rewired instead of
        // throwing AssertionError, and (b) is intermediary-mapped, so Loom remaps it
        // cleanly. Neither is true of the raw dev jars: a fileTree of them skips the
        // @ExpectPlatform transform, and consuming the project via modImplementation
        // double-remaps the already-named variant and corrupts method signatures.
        modCompileOnly("net.creeperhost:polylib-fabric:${polylib_version}") {
            transitive false
        }
        modLocalRuntime fileTree(rootProject.file(".polylib-repo/fabric/build/libs")) {
            include "polylib-*-fabric.jar"
        }
        modLocalRuntime "teamreborn:energy:4.1.0"
        implementation "io.sentry:sentry:5.7.2"

        // Build (and freshen) polylib's production jar before any run task. :fabric:assemble
        // transitively builds the shadowed common classes too. Guarded by the .polylib-repo
        // check, so plain Maven-only builds never reference the included build.
        def polylibProductionJar = gradle.includedBuild(".polylib-repo").task(":fabric:assemble")
        ["runClient", "runClientLogin", "runServer"].each { runTaskName ->
            tasks.matching { it.name == runTaskName }.configureEach {
                dependsOn polylibProductionJar
            }
        }
    } else {
        modApi("net.creeperhost:polylib-fabric:${polylib_version}")
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }

    shadowLib "blue.endless:jankson:${jankson_version}"
    shadowLib("net.creeperhost:MineTogetherLib:${mtlib_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
    }
    shadowLib("net.creeperhost:MineTogetherSessions:${mtsession_version}") {
        transitive false
    }
    shadowLib("net.creeperhost:MTConnectProxyCommon:${mtproxy_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
        exclude group: "net.creeperhost", module: "MineTogetherLib"
    }

    shadowLib 'org.nanohttpd:nanohttpd:2.3.1'
    shadowLib 'com.github.scribejava:scribejava-apis:6.9.0'
    shadowLib 'com.github.scribejava:scribejava-core:6.9.0'
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    mergeServiceFiles()

    relocate 'blue.endless', 'net.creeperhost.minetogethercommunity.repack.blue.endless'
    relocate 'net.covers1624', 'net.creeperhost.minetogethercommunity.repack.net.covers1624'
    relocate 'org.pircbotx', 'net.creeperhost.minetogethercommunity.repack.org.pircbotx'
    relocate 'com.github.scribejava', 'net.creeperhost.minetogethercommunity.com.github.scribejava'
    relocate 'fi.iki.elonen', 'net.creeperhost.minetogethercommunity.fi.iki.elonen'
    // TODO can we switch scribejava to using Gson?
    relocate 'com.fasterxml.jackson', 'net.creeperhost.minetogethercommunity.com.fasterxml.jackson'
    relocate 'net.creeperhost.minetogether.lib', 'net.creeperhost.minetogethercommunity.repack.minetogether.lib'
    relocate 'net.creeperhost.minetogether.session', 'net.creeperhost.minetogethercommunity.repack.minetogether.session'
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveBaseName.set "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}"
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
}

