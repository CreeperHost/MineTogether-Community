// ASM is used by the in-script Log4j-compat bytecode tasks further down.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm:9.7"
    }
}

plugins {
    id "java-library"
    id "maven-publish"
    // RetroFuturaGradle replaces the legacy ForgeGradle 1.2 toolchain for 1.7.10.
    id "com.gtnewhorizons.retrofuturagradle" version "1.4.9"
    // GradleUp shadow (successor to johnrengelman's plugin) for the shaded fat jar.
    id "com.gradleup.shadow" version "8.3.5"
}

base {
    archivesName = archives_base_name
}
version = mod_version
group = maven_group

// Decouple the JDK that runs Gradle from the JDK that compiles the mod: the mod is
// compiled to Java 8 bytecode by a real JDK 8 toolchain (auto-provisioned via foojay),
// which is also what keeps reobf inheritance resolution behaving like the 1.7.10 era.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = org.gradle.jvm.toolchain.JvmVendorSpec.AZUL
    }
}

// RFG's 1.7.10 defaults are forge 10.13.4.1614 + stable_12 mappings, i.e. the same
// versions previously pinned in gradle.properties.
minecraft {
    mcVersion = "1.7.10"
    username = "Developer"
    // Pin to stable_12, the mappings the mod was written against. RFG 1.4.9 otherwise
    // defaults 1.7.10 to stable_39, which renamed members (e.g. fontRendererObj ->
    // fontRenderer), breaking compilation.
    mcpMappingChannel = "stable"
    mcpMappingVersion = "12"
}

repositories {
    mavenLocal()
    maven { url = "https://maven.creeperhost.net" }
    mavenCentral()
}

configurations {
    devLogin
    shade
    implementation.extendsFrom shade
    all {
        resolutionStrategy.force "net.covers1624:Quack:0.4.10.128"
    }
}

dependencies {
    devLogin "net.covers1624:DevLogin:0.1.0.5"
    shade("net.creeperhost:MineTogetherLib:${mtlib_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
    }
    shade("net.creeperhost:MineTogetherSessions:${mtsession_version}") {
        transitive = false
    }
    shade("net.creeperhost:MTConnectProxyCommon:${mtproxy_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherLib"
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
    }
    shade "net.covers1624:Quack:0.4.10.128"
    shade "net.covers1624:pircbotx:2.3.11"
    shade "com.google.guava:guava:21.0"
    shade "org.nanohttpd:nanohttpd:2.3.1"
    shade "org.apache.httpcomponents:httpclient:4.5.14"
    shade "org.apache.httpcomponents:httpcore:4.4.16"
    shade "org.apache.httpcomponents:httpmime:4.5.14"
    shade "commons-codec:commons-codec:1.15"
    shade "commons-io:commons-io:2.11.0"
    shade "commons-logging:commons-logging:1.2"
    shade "org.apache.commons:commons-lang3:3.12.0"
    shade "org.apache.commons:commons-text:1.10.0"
    shade "org.jetbrains:annotations:24.1.0"
    shade "org.slf4j:slf4j-api:1.7.36"
    shade "org.slf4j:slf4j-nop:1.7.36"
    testImplementation "junit:junit:4.13.2"
}

sourceSets {
    main {
        // src/main/java and src/main/resources are already the default source dirs; only
        // the excludes below are meaningful. Re-adding the default resources dir made
        // Gradle 8's processResources enumerate it twice -> duplicate-entry failure.
        java.exclude "net/creeperhost/minetogethercommunity/compat/ftbquests/**"
        java.exclude "net/creeperhost/minetogethercommunity/util/LoggerNameStartsWithFilter.java"
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    filesMatching("mcmod.info") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}

// Route RFG's runClient through covers1624 DevLogin so a real Microsoft account is used
// in dev (RFG's default is the dummy "Developer" offline account).
//
// runClient is a RunMinecraftTask (extends JavaExec) whose mainClass is GradleStart. RFG
// appends Minecraft's launch args (--username/--uuid/--accessToken/...) in its own doFirst,
// registered in the task constructor as "setup late-binding arguments". Gradle runs doFirst
// actions most-recently-added-first, so the block below executes BEFORE RFG's: we capture
// the real main class (GradleStart), hand it to DevLogin via --launch_target, and RFG then
// appends the MC args after it. DevLogin authenticates and overrides the credential args
// before delegating to GradleStart.
//
// Everything is done in the doFirst (execution time) so it is robust against RFG finalizing
// the classpath/args in an afterEvaluate: by the time this runs, RFG's wiring is in place
// and we only add to it. setupLateArgs preserves existing jvmArgs/args and appends.
tasks.matching { it.name == "runClient" }.all { JavaExec task ->
    task.doFirst {
        task.classpath = task.classpath + configurations.devLogin
        String launchTarget = task.mainClass.get()
        if (launchTarget != "net.covers1624.devlogin.DevLogin") {
            gradle.startParameter.systemPropertiesArgs.each { name, value ->
                task.jvmArgs(value == null || value.isEmpty() ? "-D${name}" : "-D${name}=${value}")
            }
            task.args("--launch_target", launchTarget)
            task.mainClass.set("net.covers1624.devlogin.DevLogin")
        }
    }
}

shadowJar {
    configurations = [project.configurations.shade]
    // The shaded (deobf) jar is an intermediate; reobfJar produces the final no-classifier artifact.
    archiveClassifier = "shaded"
    exclude "module-info.class"
    exclude "META-INF/versions/**"
    exclude "net/covers1624/quack/net/httpapi/java11/**"
    exclude "net/covers1624/quack/asm/**"
    exclude "net/covers1624/quack/gradle/**"
    exclude "net/covers1624/quack/logging/**"
    exclude "net/covers1624/quack/net/httpapi/curl4j/**"
    exclude "net/covers1624/quack/net/httpapi/okhttp/**"
    exclude "net/covers1624/quack/net/okhttp/**"
    exclude "net/covers1624/quack/net/download/DownloadProgressTail*.class"
    exclude "org/apache/commons/logging/impl/AvalonLogger.class"
    exclude "org/apache/commons/logging/impl/Log4JLogger.class"
    exclude "org/apache/commons/logging/impl/LogKitLogger.class"
    exclude "org/apache/commons/logging/impl/ServletContextCleaner.class"
    relocate "net.covers1624", "net.creeperhost.minetogethercommunity.repack.net.covers1624"
    relocate "org.pircbotx", "net.creeperhost.minetogethercommunity.repack.org.pircbotx"
    relocate "fi.iki.elonen", "net.creeperhost.minetogethercommunity.repack.fi.iki.elonen"
    relocate "net.creeperhost.minetogether.lib", "net.creeperhost.minetogethercommunity.repack.minetogether.lib"
    relocate "net.creeperhost.minetogether.session", "net.creeperhost.minetogethercommunity.repack.minetogether.session"
    relocate "net.creeperhost.minetogether.connect", "net.creeperhost.minetogethercommunity.repack.minetogether.connect"
    relocate "org.apache.http", "net.creeperhost.minetogethercommunity.repack.org.apache.http"
    relocate "org.apache.commons.codec", "net.creeperhost.minetogethercommunity.repack.org.apache.commons.codec"
    relocate "org.apache.commons.io", "net.creeperhost.minetogethercommunity.repack.org.apache.commons.io"
    relocate "org.apache.commons.logging", "net.creeperhost.minetogethercommunity.repack.org.apache.commons.logging"
    relocate "org.apache.commons.lang3", "net.creeperhost.minetogethercommunity.repack.org.apache.commons.lang3"
    relocate "org.apache.commons.text", "net.creeperhost.minetogethercommunity.repack.org.apache.commons.text"
    relocate "org.jetbrains.annotations", "net.creeperhost.minetogethercommunity.repack.org.jetbrains.annotations"
    relocate "org.slf4j", "net.creeperhost.minetogethercommunity.repack.org.slf4j"
    relocate "com.google.common", "net.creeperhost.minetogethercommunity.repack.com.google.common"
}

ext.legacyLog4jReplacementDescriptor = { String desc ->
    String prefix = "(Ljava/lang/String;"
    if (!desc.startsWith(prefix) || !desc.endsWith(")V")) {
        return null
    }
    String args = desc.substring(prefix.length(), desc.length() - 2)
    int count = 0
    while (args.startsWith("Ljava/lang/Object;")) {
        count++
        args = args.substring("Ljava/lang/Object;".length())
    }
    if (count == 0 || count > 4 || args.length() != 0) {
        return null
    }
    return "(Lorg/apache/logging/log4j/Logger;Ljava/lang/String;" + ((1..count).collect { "Ljava/lang/Object;" }.join("")) + ")V"
}

task patchLegacyLog4jCalls {
    dependsOn shadowJar
    doLast {
        File jarFile = shadowJar.archiveFile.get().asFile
        File tmpFile = new File(jarFile.parentFile, jarFile.name + ".log4jfix")
        int patchedCalls = 0
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            new java.util.zip.ZipOutputStream(new FileOutputStream(tmpFile)).withCloseable { out ->
                zip.entries().each { entry ->
                    byte[] bytes = zip.getInputStream(entry).withCloseable { stream -> stream.bytes }
                    if (entry.name.endsWith(".class")) {
                        def patched = [false]
                        def reader = new org.objectweb.asm.ClassReader(bytes)
                        def writer = new org.objectweb.asm.ClassWriter(reader, 0)
                        def visitor = new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM5, writer) {
                            @Override
                            org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String desc, String signature, String[] exceptions) {
                                def methodVisitor = super.visitMethod(access, name, desc, signature, exceptions)
                                return new org.objectweb.asm.MethodVisitor(org.objectweb.asm.Opcodes.ASM5, methodVisitor) {
                                    @Override
                                    void visitMethodInsn(int opcode, String owner, String methodName, String methodDesc, boolean itf) {
                                        String replacementDesc = project.legacyLog4jReplacementDescriptor(methodDesc)
                                        boolean legacyLoggerCall = (opcode == org.objectweb.asm.Opcodes.INVOKEINTERFACE
                                                && owner == "org/apache/logging/log4j/Logger"
                                                && ["trace", "debug", "info", "warn", "error", "fatal"].contains(methodName)
                                                && replacementDesc != null)
                                        if (legacyLoggerCall) {
                                            patched[0] = true
                                            patchedCalls++
                                            super.visitMethodInsn(
                                                    org.objectweb.asm.Opcodes.INVOKESTATIC,
                                                    "net/creeperhost/minetogethercommunity/util/LegacyLog4jCompat",
                                                    methodName,
                                                    replacementDesc,
                                                    false
                                            )
                                            return
                                        }
                                        super.visitMethodInsn(opcode, owner, methodName, methodDesc, itf)
                                    }
                                }
                            }
                        }
                        reader.accept(visitor, 0)
                        if (patched[0]) {
                            bytes = writer.toByteArray()
                        }
                    }
                    def outEntry = new java.util.zip.ZipEntry(entry.name)
                    outEntry.time = entry.time
                    out.putNextEntry(outEntry)
                    out.write(bytes)
                    out.closeEntry()
                }
            }
        }
        if (!jarFile.delete()) {
            throw new GradleException("Could not delete ${jarFile} before writing Log4j compatibility patched jar")
        }
        if (!tmpFile.renameTo(jarFile)) {
            throw new GradleException("Could not replace ${jarFile} with Log4j compatibility patched jar")
        }
        if (patchedCalls > 0) {
            println "Patched ${patchedCalls} Log4j fixed-arity calls for Minecraft 1.7.10 compatibility."
        }
    }
}

// RFG registers a `reobfJar` task that reobfuscates the `jar` output by default.
// Repoint it at the shaded jar so the published artifact is shaded + reobfuscated, and
// make it the primary (no-classifier) artifact. RFG auto-wires the SRG/CSV mappings and
// the reference classpath (full MC + Forge + deps) used for inheritance-aware reobf.
tasks.named("reobfJar", com.gtnewhorizons.retrofuturagradle.mcp.ReobfuscatedJar) {
    setInputJarFromTask(tasks.named("shadowJar"))
    archiveClassifier = ""
    // patchLegacyLog4jCalls rewrites the shaded jar in place before reobf reads it.
    dependsOn "patchLegacyLog4jCalls"
}

tasks.named("build") {
    dependsOn "reobfJar"
}

task checkClassfileVersion {
    dependsOn "reobfJar"
    doLast {
        new java.util.zip.ZipFile(tasks.reobfJar.archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.name.endsWith(".class")) {
                    return
                }
                zip.getInputStream(entry).withCloseable { stream ->
                byte[] header = new byte[8]
                stream.read(header)
                int major = ((header[6] & 0xFF) << 8) | (header[7] & 0xFF)
                if (major > 52) {
                        throw new GradleException("Class ${entry.name} has classfile major ${major}; expected Java 8 (52) or lower")
                    }
                }
            }
        }
    }
}

task checkReobfuscatedJar {
    dependsOn "reobfJar"
    doLast {
        def checks = [
                [
                        entry: "net/creeperhost/minetogethercommunity/client/ClientEvents.class",
                        forbidden: ["getMinecraft", "theWorld", "displayGuiScreen", "currentScreen"],
                        required: ["func_71410_x", "field_71441_e", "func_147108_a", "field_71462_r"]
                ],
                [
                        entry: "net/creeperhost/minetogethercommunity/cosmetic/render/LegacyCosmeticRenderer.class",
                        forbidden: ["getMinecraft", "modelBipedMain", "renderCloak", "isSneaking", "isRiding", "prevDistanceWalkedModified", "distanceWalkedModified", "prevCameraYaw", "cameraYaw"],
                        required: ["func_71410_x", "field_77109_a", "func_78111_c", "func_70093_af", "func_70115_ae", "field_70141_P", "field_70140_Q", "field_71107_bF", "field_71109_bG"]
                ],
                [
                        entry: "net/creeperhost/minetogethercommunity/client/MineTogetherSettingsCommand.class",
                        forbidden: [],
                        required: ["func_71517_b", "func_71518_a", "func_71515_b", "func_82362_a"]
                ],
                [
                        entry: "net/creeperhost/minetogethercommunity/client/OpenFriendChatCommand.class",
                        forbidden: [],
                        required: ["func_71517_b", "func_71518_a", "func_71515_b", "func_82362_a"]
                ],
                [
                        entry: "net/creeperhost/minetogethercommunity/connect/ConnectHandler.class",
                        forbidden: ["field_151336_a"],
                        required: ["field_72405_c", "field_71346_p", "field_71345_q"]
                ]
        ]
        def offenders = []
        new java.util.zip.ZipFile(tasks.reobfJar.archiveFile.get().asFile).withCloseable { zip ->
            checks.each { check ->
                def entry = zip.getEntry(check.entry)
                if (entry == null) {
                    offenders << "${check.entry} is missing from shaded jar"
                    return
                }
                byte[] bytes = zip.getInputStream(entry).withCloseable { stream ->
                    stream.bytes
                }
                String text = new String(bytes, "ISO-8859-1")
                check.forbidden.each { token ->
                    if (text.contains(token)) {
                        offenders << "${check.entry} still contains MCP name ${token}; shaded jar was not reobfuscated"
                    }
                }
                check.required.each { token ->
                    if (!text.contains(token)) {
                        offenders << "${check.entry} is missing expected SRG name ${token}; shaded jar may not be reobfuscated"
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Shaded jar reobfuscation check failed:\n" + offenders.sort().join("\n"))
        }
    }
}

task checkJarHygiene {
    dependsOn "reobfJar"
    doLast {
        def forbidden = [
                ~/^META-INF\/versions\//,
                ~/(^|\/)module-info\.class$/,
                ~/fabric\.mod\.json$/,
                ~/neoforge\.mods\.toml$/,
                ~/accesswidener$/,
                ~/mixins\.json$/,
                ~/(^|\/)mixin\//,
                ~/^net\/creeperhost\/minetogethercommunity\/repack\/net\/covers1624\/quack\/asm\//,
                ~/^net\/creeperhost\/minetogethercommunity\/repack\/net\/covers1624\/quack\/gradle\//,
                ~/^net\/creeperhost\/minetogethercommunity\/repack\/net\/covers1624\/quack\/logging\//,
                ~/^net\/creeperhost\/minetogethercommunity\/repack\/net\/covers1624\/quack\/net\/httpapi\/curl4j\//,
                ~/^net\/creeperhost\/minetogethercommunity\/repack\/net\/covers1624\/quack\/net\/httpapi\/okhttp\//,
                ~/^net\/creeperhost\/minetogethercommunity\/repack\/net\/covers1624\/quack\/net\/okhttp\//,
                ~/^net\/creeperhost\/minetogethercommunity\/repack\/net\/covers1624\/quack\/net\/download\/DownloadProgressTail/,
                ~/^net\/creeperhost\/minetogethercommunity\/repack\/org\/apache\/commons\/logging\/impl\/(?:AvalonLogger|Log4JLogger|LogKitLogger|ServletContextCleaner)\.class$/,
                ~/^org\/apache\/http\//,
                ~/^org\/apache\/commons\/codec\//,
                ~/^org\/apache\/commons\/io\//,
                ~/^org\/apache\/commons\/logging\//,
                ~/^org\/apache\/commons\/lang3\//,
                ~/^org\/apache\/commons\/text\//,
                ~/^org\/jetbrains\/annotations\//,
                ~/^org\/slf4j\//,
                ~/^com\/google\/common\//,
                ~/(^|\/)com\/fasterxml\//,
                ~/(^|\/)org\/codehaus\/jackson\//,
                ~/(^|\/)com\/github\/scribejava\//
        ]
        def offenders = []
        new java.util.zip.ZipFile(tasks.reobfJar.archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                String name = entry.name
                if (forbidden.any { pattern -> (name =~ pattern).find() }) {
                    offenders << name
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Forbidden modern-loader or incompatible dependency entries found in shaded jar:\n" + offenders.sort().join("\n"))
        }
    }
}

task checkRuntimeDependencyCompleteness {
    dependsOn "reobfJar"
    doLast {
        def required = [
                "net/creeperhost/minetogethercommunity/repack/net/covers1624/quack/net/httpapi/apache/ApacheEngine.class",
                "net/creeperhost/minetogethercommunity/repack/org/apache/http/client/HttpClient.class",
                "net/creeperhost/minetogethercommunity/repack/org/apache/http/entity/mime/content/ContentBody.class",
                "net/creeperhost/minetogethercommunity/repack/org/apache/commons/codec/binary/Base64.class",
                "net/creeperhost/minetogethercommunity/repack/org/apache/commons/io/IOUtils.class",
                "net/creeperhost/minetogethercommunity/repack/org/apache/commons/logging/Log.class",
                "net/creeperhost/minetogethercommunity/repack/org/apache/commons/lang3/StringUtils.class",
                "net/creeperhost/minetogethercommunity/repack/org/apache/commons/text/WordUtils.class",
                "net/creeperhost/minetogethercommunity/repack/org/jetbrains/annotations/ApiStatus.class",
                "net/creeperhost/minetogethercommunity/repack/org/slf4j/Logger.class",
                "net/creeperhost/minetogethercommunity/repack/org/slf4j/impl/StaticLoggerBinder.class",
                "net/creeperhost/minetogethercommunity/repack/com/google/common/base/CharMatcher.class",
                "net/creeperhost/minetogethercommunity/repack/org/pircbotx/PircBotX.class"
        ] as Set
        def present = [] as Set
        new java.util.zip.ZipFile(tasks.reobfJar.archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (required.contains(entry.name)) {
                    present << entry.name
                }
            }
        }
        def missing = required - present
        if (!missing.isEmpty()) {
            throw new GradleException("Missing shaded runtime dependency classes needed for MineTogether HTTP/IRC startup:\n" + missing.sort().join("\n"))
        }
    }
}

task checkLegacyLog4jCompatibility {
    dependsOn "reobfJar"
    doLast {
        def offenders = []
        new java.util.zip.ZipFile(tasks.reobfJar.archiveFile.get().asFile).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.name.endsWith(".class")) {
                    return
                }
                byte[] bytes = zip.getInputStream(entry).withCloseable { stream -> stream.bytes }
                def reader = new org.objectweb.asm.ClassReader(bytes)
                def visitor = new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM5) {
                    @Override
                    org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String desc, String signature, String[] exceptions) {
                        return new org.objectweb.asm.MethodVisitor(org.objectweb.asm.Opcodes.ASM5) {
                            @Override
                            void visitMethodInsn(int opcode, String owner, String methodName, String methodDesc, boolean itf) {
                                if ((opcode == org.objectweb.asm.Opcodes.INVOKEINTERFACE
                                        && owner == "org/apache/logging/log4j/Logger"
                                        && ["trace", "debug", "info", "warn", "error", "fatal"].contains(methodName)
                                        && project.legacyLog4jReplacementDescriptor(methodDesc) != null)) {
                                    offenders << "${entry.name} calls Logger.${methodName}${methodDesc}"
                                }
                            }
                        }
                    }
                }
                reader.accept(visitor, org.objectweb.asm.ClassReader.SKIP_DEBUG | org.objectweb.asm.ClassReader.SKIP_FRAMES)
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Shaded jar still calls Log4j overloads missing from Minecraft 1.7.10:\n" + offenders.sort().join("\n"))
        }
    }
}

task checkResourceReferences {
    doLast {
        File assetRoot = file("src/main/resources/assets/minetogethercommunity")
        def missing = []
        def locationPattern = ~/new\s+ResourceLocation\s*\(\s*MineTogether\.MOD_ID\s*,\s*"([^"]+)"\s*\)/
        fileTree("src/main/java") { include "**/*.java" }.each { source ->
            def matcher = locationPattern.matcher(source.getText("UTF-8"))
            while (matcher.find()) {
                String path = matcher.group(1)
                if (!path.startsWith("dynamic/")) {
                    File resource = new File(assetRoot, path)
                    if (!resource.isFile()) {
                        missing << "${project.relativePath(source)} -> assets/minetogethercommunity/${path}"
                    }
                }
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing MineTogether asset references:\n" + missing.sort().join("\n"))
        }
    }
}

task checkLanguageKeys {
    doLast {
        File langFile = file("src/main/resources/assets/minetogethercommunity/lang/en_US.lang")
        def langKeys = new LinkedHashSet<String>()
        langFile.eachLine("UTF-8") { line ->
            def matcher = (line =~ /^\s*([^#=\s][^=]*)=/)
            if (matcher.find()) {
                langKeys.add(matcher.group(1).trim())
            }
        }

        def missing = []
        def keyPattern = ~/(?:I18n\.format|TextComponentTranslation|GuiButton\.translated)\(\s*"([^"]+)"/
        fileTree("src/main/java") { include "**/*.java" }.each { source ->
            def matcher = keyPattern.matcher(source.getText("UTF-8"))
            while (matcher.find()) {
                String key = matcher.group(1)
                boolean mineTogetherKey = key.startsWith("minetogether") || key.startsWith("key.minetogethercommunity")
                if (mineTogetherKey && !key.endsWith(".") && !langKeys.contains(key)) {
                    missing << "${project.relativePath(source)} -> ${key}"
                }
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing MineTogether language keys:\n" + missing.sort().join("\n"))
        }
    }
}

task checkServerEntrypoints {
    doLast {
        def serverLoadedSources = [
                file("src/main/java/net/creeperhost/minetogethercommunity/MineTogether.java"),
                file("src/main/java/net/creeperhost/minetogethercommunity/proxy/CommonProxy.java")
        ]
        def forbidden = [
                "net.minecraft.client",
                "net.minecraftforge.client",
                "net.creeperhost.minetogethercommunity.client.",
                "net.creeperhost.minetogethercommunity.gui.",
                "net.creeperhost.minetogethercommunity.cosmetic.render.",
                "Minecraft.getMinecraft",
                "GuiScreen",
                "ClientCommandHandler",
                "KeyBinding"
        ]
        def offenders = []
        serverLoadedSources.each { source ->
            String text = source.getText("UTF-8")
            forbidden.each { token ->
                if (text.contains(token)) {
                    offenders << "${project.relativePath(source)} -> ${token}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Client-only references found in server-loaded entrypoints:\n" + offenders.sort().join("\n"))
        }
    }
}

task checkBackportSourceHygiene {
    doLast {
        def forbidden = [
                ~/net\.fabricmc/,
                ~/fabric\.mod\.json/,
                ~/(?i)architectury/,
                ~/net\.neoforged/,
                ~/neoforge\.mods\.toml/,
                ~/java\.net\.http/,
                ~/com\.fasterxml/,
                ~/org\.codehaus\.jackson/,
                ~/com\.github\.scribejava/
        ]
        def offenders = []
        fileTree("src/main") {
            include "**/*.java"
            include "**/*.json"
            include "**/*.info"
            include "**/*.mcmeta"
            include "**/*.lang"
        }.each { source ->
            String text = source.getText("UTF-8")
            forbidden.each { pattern ->
                if ((text =~ pattern).find()) {
                    offenders << "${project.relativePath(source)} -> ${pattern}"
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Forbidden modern-loader or incompatible source references found:\n" + offenders.sort().join("\n"))
        }
    }
}

task checkLegacyResourceMetadata {
    doLast {
        File resourcesRoot = file("src/main/resources")
        File mcmod = new File(resourcesRoot, "mcmod.info")
        File pack = new File(resourcesRoot, "pack.mcmeta")
        File lang = new File(resourcesRoot, "assets/minetogethercommunity/lang/en_US.lang")
        File modernLang = new File(resourcesRoot, "assets/minetogethercommunity/lang/en_us.json")

        if (!mcmod.isFile()) {
            throw new GradleException("Forge 1.7.10 metadata is missing mcmod.info")
        }
        if (!pack.isFile()) {
            throw new GradleException("Forge 1.7.10 resources are missing pack.mcmeta")
        }
        if (!lang.isFile()) {
            throw new GradleException("Forge 1.7.10 resources are missing en_US.lang")
        }
        if (modernLang.exists()) {
            throw new GradleException("Forge 1.7.10 resources must use en_US.lang, not en_us.json")
        }

        def parser = new groovy.json.JsonSlurper()
        def mods = parser.parse(mcmod)
        if (!(mods instanceof List) || mods.isEmpty()) {
            throw new GradleException("mcmod.info must contain a Forge 1.7.10 mod info array")
        }
        if (mods[0].modid != "minetogethercommunity" || mods[0].mcversion != "1.7.10") {
            throw new GradleException("mcmod.info must target minetogethercommunity on Minecraft 1.7.10")
        }

        def packMeta = parser.parse(pack)
        if (packMeta.pack == null || packMeta.pack.pack_format != 1) {
            throw new GradleException("pack.mcmeta must use pack_format 1 for Minecraft 1.7.10")
        }
    }
}

check.dependsOn checkClassfileVersion
check.dependsOn checkReobfuscatedJar
check.dependsOn checkJarHygiene
check.dependsOn checkRuntimeDependencyCompleteness
check.dependsOn checkResourceReferences
check.dependsOn checkLanguageKeys
check.dependsOn checkServerEntrypoints
check.dependsOn checkBackportSourceHygiene
check.dependsOn checkLegacyResourceMetadata
