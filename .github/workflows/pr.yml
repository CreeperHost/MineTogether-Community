name: Commit Tests

on:
  push:
  pull_request:
    branches:
      - '26.3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read Java version
        id: java
        shell: bash
        run: |
          version="$(sed -n 's/^java_version=//p' gradle.properties | tr -d '\r')"
          [[ "$version" =~ ^[0-9]+$ ]] || { echo 'Missing or invalid java_version'; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build and test
        shell: bash
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          mkdir -p build/ci
          set -o pipefail
          ./gradlew build --init-script common/tests/test-support.gradle \
            --stacktrace --no-daemon --console=plain 2>&1 | tee build/ci/gradle.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics
          path: |
            build/ci
            **/build/reports
            **/build/test-results
          if-no-files-found: ignore
          retention-days: 7
