name: PR Compile Check

on:
  pull_request:
    branches:
      - '1.21cosmetics'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace --no-daemon
