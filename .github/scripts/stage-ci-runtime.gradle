gradle.projectsEvaluated {
    def root = gradle.rootProject
    // Init scripts also run for the buildSrc build on current Gradle. Only the
    // main MineTogether build owns the standalone Connect service sources.
    if (!root.file(".github/connect-service").isDirectory()) {
        return
    }
    def commonProject = root.findProject(":common")
    if (commonProject == null) {
        throw new GradleException("The local MTConnect CI service requires project ':common'")
    }

    def commonSourceSets = commonProject.extensions.getByType(org.gradle.api.tasks.SourceSetContainer)
    def serviceSourceSet = commonSourceSets.maybeCreate("ciConnectService")
    serviceSourceSet.java.srcDir(root.file(".github/connect-service/src/main/java"))

    def serviceTestSourceSet = commonSourceSets.maybeCreate("ciConnectServiceTest")
    serviceTestSourceSet.java.srcDir(root.file(".github/connect-service/src/test/java"))
    serviceTestSourceSet.compileClasspath += serviceSourceSet.output + serviceSourceSet.compileClasspath
    serviceTestSourceSet.runtimeClasspath += serviceSourceSet.output + serviceSourceSet.runtimeClasspath

    def addServiceDependency = { String configuration, String coordinate, boolean transitive = true ->
        def dependency = commonProject.dependencies.create(coordinate)
        dependency.transitive = transitive
        commonProject.dependencies.add(configuration, dependency)
    }
    addServiceDependency(serviceSourceSet.implementationConfigurationName,
            "net.creeperhost:MTConnectProxyCommon:${root.property('mtproxy_version')}", false)
    addServiceDependency(serviceSourceSet.implementationConfigurationName, "net.covers1624:Quack:0.4.10.101", false)
    addServiceDependency(serviceSourceSet.implementationConfigurationName, "io.netty:netty-handler:4.1.82.Final")
    addServiceDependency(serviceSourceSet.implementationConfigurationName, "com.google.guava:guava:31.1-jre")
    addServiceDependency(serviceSourceSet.implementationConfigurationName, "org.apache.logging.log4j:log4j-core:2.19.0")
    addServiceDependency(serviceSourceSet.compileOnlyConfigurationName, "org.jetbrains:annotations:23.1.0")
    addServiceDependency(serviceTestSourceSet.implementationConfigurationName, "org.junit.jupiter:junit-jupiter-api:5.8.2")
    addServiceDependency(serviceTestSourceSet.runtimeOnlyConfigurationName, "org.junit.jupiter:junit-jupiter-engine:5.8.2")
    addServiceDependency(serviceTestSourceSet.runtimeOnlyConfigurationName, "org.junit.platform:junit-platform-launcher:1.8.2")

    def serviceTest = commonProject.tasks.register("ciConnectServiceTest", Test) {
        group = "verification"
        description = "Runs focused tests for the standalone local MTConnect service."
        dependsOn(commonProject.tasks.named(serviceTestSourceSet.classesTaskName))
        testClassesDirs = serviceTestSourceSet.output.classesDirs
        classpath = serviceTestSourceSet.runtimeClasspath
        useJUnitPlatform()
    }

    def serviceJar = commonProject.tasks.register("ciConnectServiceJar", Jar) {
        group = "verification"
        description = "Builds the standalone local MTConnect service used by runtime tests."
        dependsOn(commonProject.tasks.named(serviceSourceSet.classesTaskName))
        archiveBaseName.set("minetogether-local-connect-service")
        archiveClassifier.set("all")
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from {
            def core = serviceSourceSet.runtimeClasspath.find { it.name.startsWith("log4j-core-") && it.name.endsWith(".jar") }
            core == null ? [] : zipTree(core).matching {
                include("META-INF/org/apache/logging/log4j/core/config/plugins/Log4j2Plugins.dat")
            }
        }
        from(serviceSourceSet.output)
        from({
            serviceSourceSet.runtimeClasspath
                    .filter { it.isFile() && it.name.endsWith(".jar") }
                    .collect { zipTree(it) }
        }) {
            exclude("META-INF/org/apache/logging/log4j/core/config/plugins/Log4j2Plugins.dat")
        }
        exclude("META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA")
        manifest {
            attributes(
                    "Main-Class": "net.creeperhost.minetogethercommunity.ci.connectservice.LocalConnectService",
                    "Multi-Release": "true"
            )
        }
    }

    def stageService = root.tasks.register("stageCiConnectService") {
        group = "verification"
        description = "Tests and stages the standalone local MTConnect service."
        dependsOn(serviceTest, serviceJar)
        doLast {
            def outputDir = root.layout.buildDirectory.dir("ci-runtime/connect-service").get().asFile
            root.delete(outputDir)
            outputDir.mkdirs()
            root.copy {
                from(serviceJar.flatMap { it.archiveFile })
                into(outputDir)
            }
            logger.lifecycle("Staged local MTConnect service in ${outputDir}")
        }
    }

    def enabledPlatforms = root.findProperty("enabled_platforms")
    def loaders = enabledPlatforms
            ? enabledPlatforms.toString().split(",").collect { it.trim() }.findAll { !it.isEmpty() }
            : ["fabric", "forge", "neoforge"].findAll { root.findProject(":" + it) != null }

    def stageAll = root.tasks.register("stageCiRuntime") {
        group = "verification"
        description = "Stages production jars and required runtime dependencies for CI client launches."
        dependsOn(stageService)
    }

    loaders.each { loader ->
        def loaderProject = root.findProject(":" + loader)
        if (loaderProject == null) {
            throw new GradleException("enabled_platforms contains '${loader}', but project ':${loader}' does not exist")
        }

        def remapTask = loaderProject.tasks.findByName("remapJar")
        def productionTask = remapTask ?: loaderProject.tasks.findByName("shadowJar") ?: loaderProject.tasks.findByName("jar")
        if (productionTask == null) {
            throw new GradleException("Project ':${loader}' does not provide a production jar task")
        }

        def sourceSets = loaderProject.extensions.getByType(org.gradle.api.tasks.SourceSetContainer)
        def mainSourceSet = sourceSets.getByName("main")
        def probeSourceSet = sourceSets.maybeCreate("ciProbe")
        probeSourceSet.java.srcDirs(
                root.file(".github/ci-probe/src/main/java"),
                root.file(".github/ci-probe/src/${loader}/java")
        )
        probeSourceSet.resources.srcDir(root.file(".github/ci-probe/src/${loader}/resources"))
        probeSourceSet.compileClasspath += mainSourceSet.output + mainSourceSet.compileClasspath
        probeSourceSet.runtimeClasspath += probeSourceSet.output + probeSourceSet.compileClasspath

        def probeJar = loaderProject.tasks.register("ciProbeJar", Jar) {
            group = "verification"
            description = "Builds the ${loader} CI-only multiplayer probe."
            dependsOn(loaderProject.tasks.named(probeSourceSet.classesTaskName))
            from(probeSourceSet.output)
            archiveBaseName.set("minetogether-ci-probe-${loader}-${root.property('minecraft_version')}")
            archiveClassifier.set("dev")
        }

        // Versions using intermediary mappings need the probe remapped too. Newer official-
        // mappings builds have no remapJar task, so their ordinary probe jar is launch-ready.
        def probeOutputTask = probeJar
        if (remapTask != null) {
            probeOutputTask = loaderProject.tasks.register("remapCiProbeJar", remapTask.class) {
                group = "verification"
                description = "Remaps the ${loader} CI-only multiplayer probe for a production client."
                dependsOn(probeJar)
                input.set(probeJar.flatMap { it.archiveFile })
                archiveBaseName.set("minetogether-ci-probe-${loader}-${root.property('minecraft_version')}")
                archiveClassifier.set(null)
                if (hasProperty("addNestedDependencies")) {
                    addNestedDependencies.set(false)
                }
            }
        }

        def stageLoader = loaderProject.tasks.register("stageCiRuntimeMods") {
            group = "verification"
            description = "Stages the ${loader} production jar and runtime dependencies for CI."
            dependsOn(productionTask, probeOutputTask)

            doLast {
                def outputDir = root.layout.buildDirectory.dir("ci-runtime/${loader}/mods").get().asFile
                loaderProject.delete(outputDir)
                outputDir.mkdirs()

                def productionJar
                if (productionTask.hasProperty("archiveFile")) {
                    productionJar = productionTask.archiveFile.get().asFile
                } else {
                    productionJar = productionTask.outputs.files.files.find {
                        it.name.endsWith(".jar") && !it.name.contains("sources") && !it.name.contains("dev")
                    }
                }
                if (productionJar == null || !productionJar.isFile()) {
                    throw new GradleException("Could not find the production jar produced by ${productionTask.path}")
                }

                loaderProject.copy {
                    from productionJar
                    into outputDir
                }

                def dependencyCoordinates = []
                if (root.hasProperty("architectury_version")) {
                    dependencyCoordinates << "dev.architectury:architectury-${loader}:${root.property('architectury_version')}"
                }
                if (root.hasProperty("polylib_version")) {
                    def polyLibGroup = root.findProperty("polylib_group") ?: "net.creeperhost"
                    dependencyCoordinates << "${polyLibGroup}:polylib-${loader}:${root.property('polylib_version')}"
                }
                if (loader == "fabric" && root.hasProperty("fabric_api_version")) {
                    dependencyCoordinates << "net.fabricmc.fabric-api:fabric-api:${root.property('fabric_api_version')}"
                }

                if (!dependencyCoordinates.isEmpty()) {
                    def dependencies = dependencyCoordinates.collect { coordinate ->
                        def dependency = loaderProject.dependencies.create(coordinate)
                        dependency.transitive = false
                        dependency
                    }
                    def runtimeMods = loaderProject.configurations.detachedConfiguration(*dependencies)
                    loaderProject.copy {
                        from runtimeMods
                        into outputDir
                    }
                }

                logger.lifecycle("Staged ${loader} runtime mods in ${outputDir}")

                def probeOutputDir = root.layout.buildDirectory.dir("ci-runtime/${loader}/probe").get().asFile
                loaderProject.delete(probeOutputDir)
                probeOutputDir.mkdirs()
                loaderProject.copy {
                    from probeOutputTask.flatMap { it.archiveFile }
                    into probeOutputDir
                }
                logger.lifecycle("Staged ${loader} CI probe in ${probeOutputDir}")
            }
        }
        stageAll.configure { dependsOn(stageLoader) }
    }
}
