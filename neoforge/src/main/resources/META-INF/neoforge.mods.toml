modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
issueTrackerURL = "https://github.com/CreeperHost/MineTogether/issues"
license = "${license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    authors = "${mod_author}"
    credits = "${credits}"
    description = '''${description}'''

[[dependencies.minetogethercommunity]]
    modId = "neoforge"
    type="required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.minetogethercommunity]]
    modId = "minecraft"
    type="required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.minetogethercommunity]]
    modId = "polylib"
    type="required"
    versionRange = "[${polylib_mod_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
config = "minetogethercommunity-neoforge.mixins.json"

[[mixins]]
config = "minetogethercommunity-common.mixins.json"
