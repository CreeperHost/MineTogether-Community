plugins {
    id "com.gradleup.shadow" version "9.2.2"
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

def generatedResources = project(":common").file("src/generated/resources/")
def commonResources = project(":common").file("src/main/resources")
def commonAccessTransformer = project(":common").file("src/main/resources/META-INF/accesstransformer.cfg")
def quackRuntime = configurations.detachedConfiguration(dependencies.create("net.covers1624:Quack:${quack_version}") {
    transitive = false
})

def stripQuackForNeoForgeRuntime = tasks.register('stripQuackForNeoForgeRuntime', Jar) {
    archiveBaseName = 'Quack'
    archiveVersion = quack_version
    archiveClassifier = 'neoforge-runtime'
    destinationDirectory = layout.buildDirectory.dir('strippedRuntimeLibs')
    from({ zipTree(quackRuntime.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
    }
    manifest {
        attributes 'Automatic-Module-Name': 'net.covers1624.quack'
    }
}

neoForge {
    version = neoforge_version
    if (commonAccessTransformer.exists()) {
        accessTransformers.from(commonAccessTransformer.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
            taskBefore(stripQuackForNeoForgeRuntime)
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file("runs/client"))
        }
        server {
            server()
            this.file("runs/server").createParentDirectories()
            gameDirectory = this.mkdir(this.file("runs/server"))
        }
        clientData {
            clientData()
            programArguments.addAll("--mod", "minetogethercommunity", "--all", "--output", generatedResources.absolutePath, "--existing", commonResources.absolutePath)
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation("${polylib_group}:polylib-neoforge:${polylib_version}") { transitive = false }
    accessTransformers("${polylib_group}:polylib-neoforge:${polylib_version}")

    implementation "blue.endless:jankson:${jankson_version}"
    implementation("net.creeperhost:MineTogetherLib:${mtlib_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
        exclude group: "net.covers1624", module: "Quack"
    }
    implementation("net.creeperhost:MineTogetherSessions:${mtsession_version}") {
        transitive = false
    }
    implementation("net.creeperhost:MTConnectProxyCommon:${mtproxy_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
        exclude group: "net.creeperhost", module: "MineTogetherLib"
        exclude group: "net.covers1624", module: "Quack"
    }
    runtimeOnly(files(stripQuackForNeoForgeRuntime.flatMap { it.archiveFile }))

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'com.github.scribejava:scribejava-apis:6.9.0'
    implementation 'com.github.scribejava:scribejava-core:6.9.0'

    shadow "blue.endless:jankson:${jankson_version}"
    shadow("net.creeperhost:MineTogetherLib:${mtlib_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
    }
    shadow("net.creeperhost:MineTogetherSessions:${mtsession_version}") {
        transitive = false
    }
    shadow("net.creeperhost:MTConnectProxyCommon:${mtproxy_version}") {
        exclude group: "net.creeperhost", module: "MineTogetherSessions"
        exclude group: "net.creeperhost", module: "MineTogetherLib"
    }
    shadow("net.covers1624:Quack:${quack_version}") { transitive = false }
    shadow 'org.nanohttpd:nanohttpd:2.3.1'
    shadow 'org.apache.httpcomponents:httpclient:4.5.14'
    shadow 'com.github.scribejava:scribejava-apis:6.9.0'
    shadow 'com.github.scribejava:scribejava-core:6.9.0'
}

shadowJar {
    dependsOn(jar)
    configurations = [project.configurations.shadow]
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    exclude "fabric.mod.json"
    mergeServiceFiles()

    dependencies {
        exclude(dependency('com.google::'))
        exclude(dependency('org.apache::'))
    }

    relocate 'blue.endless', 'net.creeperhost.minetogethercommunity.repack.blue.endless'
    relocate 'net.covers1624', 'net.creeperhost.minetogethercommunity.repack.net.covers1624'
    relocate 'org.pircbotx', 'net.creeperhost.minetogethercommunity.repack.org.pircbotx'
    relocate 'com.github.scribejava', 'net.creeperhost.minetogethercommunity.com.github.scribejava'
    relocate 'fi.iki.elonen', 'net.creeperhost.minetogethercommunity.fi.iki.elonen'
    relocate 'com.fasterxml.jackson', 'net.creeperhost.minetogethercommunity.com.fasterxml.jackson'
    relocate 'net.creeperhost.minetogether.lib', 'net.creeperhost.minetogethercommunity.repack.minetogether.lib'
    relocate 'net.creeperhost.minetogether.session', 'net.creeperhost.minetogethercommunity.repack.minetogether.session'
    archiveClassifier = null
}

jar {
    archiveClassifier = 'dev'
}

configurations {
    [apiElements, runtimeElements].each { config ->
        config.outgoing.artifacts.clear()
        config.outgoing.artifact(shadowJar)
    }
}

assemble.dependsOn(shadowJar)

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

publishing {
    publications {
        named('mavenJava', MavenPublication) {
            artifactId = rootProject.archives_base_name + "-neoforge"
            version = "${rootProject.minecraft_version}-${rootProject.version}"
        }
    }
}
